$kind: http-request
name: "7. Error: missing field (400 invalid_request)"
url: "{{baseUrl}}/api/v1/route/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "start": "New York, NY"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 invalid_request', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error.code).to.eql('invalid_request');
      });
    language: text/javascript
order: 8000
