$kind: http-request
name: "10. Error: outside USA (400 outside_usa)"
url: "{{baseUrl}}/api/v1/route/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "start": "61.2181,-149.9003",
      "finish": "Chicago, IL"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 outside_usa', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error.code).to.eql('outside_usa');
      });
    language: text/javascript
order: 11000
