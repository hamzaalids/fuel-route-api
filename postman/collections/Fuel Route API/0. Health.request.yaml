$kind: http-request
url: "{{baseUrl}}/api/v1/health/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 ok', () => pm.response.to.have.status(200));
      pm.test('vehicle config', () => {
        const v = pm.response.json().vehicle;
        pm.expect(v.max_range_miles).to.eql(500);
        pm.expect(v.mpg).to.eql(10);
      });
    language: text/javascript
order: 1000
