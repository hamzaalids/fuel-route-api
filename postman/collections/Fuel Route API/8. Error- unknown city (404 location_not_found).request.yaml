$kind: http-request
name: "8. Error: unknown city (404 location_not_found)"
url: "{{baseUrl}}/api/v1/route/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "start": "Qzxvbnm Imaginaryville, ZZ",
      "finish": "Chicago, IL"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 location_not_found', () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().error.code).to.eql('location_not_found');
      });
    language: text/javascript
order: 9000
